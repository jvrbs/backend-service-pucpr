spring:
  application:
    name: authserver
  datasource:
    url: jdbc:h2:mem:authserver;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  mvc:
    problemdetails:
      enabled: true
server:
  servlet:
    context-path: /api
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
app:
  security:
    secret: ${APP_SECURITY_SECRET:}
    issuer: authserver
    token-ttl: 48h
    admin-token-ttl: 1h
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
springdoc:
  paths-to-match: /users/**, /users, /health
  swagger-ui:
    persist-authorization: false
    disable-swagger-default-url: true
